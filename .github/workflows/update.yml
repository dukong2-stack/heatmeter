name: 과열 지표 수집

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 평일 18:30 (한국시간) — 장 마감 후 지수·PER·시총
    - cron: "0 0 * * 2-6"    # 평일 09:00 (한국시간) — 하루 늦게 나오는 예탁금·신용잔고 반영
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        run: python collect.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F_%H%M)"
          git push
