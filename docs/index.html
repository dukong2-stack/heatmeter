<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>증시 온도계</title>
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="증시 온도계">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1>증시 온도계</h1>
    <p class="stamp" id="stamp">데이터를 불러오는 중</p>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <p class="hero-count"><span id="hot-n">–</span><span class="hero-of"> / <span id="all-n">–</span></span></p>
    <h2 id="hero-title" class="hero-label">과열 신호가 켜진 지표</h2>
    <div class="strip" id="strip" role="img" aria-label="지표별 과열 상태"></div>
    <p class="hero-note" id="hero-note"></p>
  </section>

  <div class="notice" id="notice" hidden></div>

  <nav class="period" aria-label="기간">
    <button data-p="365" aria-pressed="true">1년</button>
    <button data-p="1095" aria-pressed="false">3년</button>
    <button data-p="3653" aria-pressed="false">10년</button>
  </nav>

  <section class="tab" data-tab="sum" aria-label="신호등">
    <ul class="signals" id="signals"></ul>
  </section>

  <section class="tab" data-tab="val" aria-label="밸류에이션" hidden>
    <figure class="chart-block"><figcaption><b>코스피</b><span>종가</span></figcaption><div class="chart" id="ch-kospi"></div></figure>
    <figure class="chart-block"><figcaption><b>코스피 PER</b><span>음영은 최근 10년 평균 ±1 표준편차. 위쪽을 벗어나면 고평가 구간입니다.</span></figcaption><div class="chart" id="ch-per"></div></figure>
    <figure class="chart-block"><figcaption><b>코스피 PBR</b><span>음영은 최근 10년 평균 ±1 표준편차.</span></figcaption><div class="chart" id="ch-pbr"></div></figure>
    <figure class="chart-block"><figcaption><b>버핏지수</b><span>코스피+코스닥 시가총액 ÷ 그해 명목 GDP. 점선이 과열 기준입니다.</span></figcaption><div class="chart" id="ch-buf"></div></figure>
  </section>

  <section class="tab" data-tab="flow" aria-label="수급" hidden>
    <figure class="chart-block"><figcaption><b>신용거래융자 잔고</b><span>조원. 빚내서 산 주식 규모입니다. 코스닥 몫을 따로 표시합니다.</span></figcaption><div class="chart" id="ch-credit"></div></figure>
    <figure class="chart-block"><figcaption><b>투자자예탁금</b><span>조원. 증권계좌에 대기 중인 돈입니다.</span></figcaption><div class="chart" id="ch-dep"></div></figure>
    <figure class="chart-block"><figcaption><b>예탁금 회전율</b><span>코스피+코스닥 거래대금 20일 평균 ÷ 예탁금(%). 치솟으면 단기 매매가 과열된 것입니다.</span></figcaption><div class="chart" id="ch-turn"></div></figure>
    <figure class="chart-block"><figcaption><b>일평균 거래대금</b><span>코스피+코스닥, 20일 평균(조원).</span></figcaption><div class="chart" id="ch-trd"></div></figure>
  </section>

  <section class="tab" data-tab="mood" aria-label="심리와 공모주" hidden>
    <figure class="chart-block"><figcaption><b>개인 거래대금 비중</b><span>월별, 매수+매도 기준(%).</span></figcaption><div class="chart" id="ch-retail"></div></figure>
    <figure class="chart-block"><figcaption><b>공모주 청약 열기</b><span>월별 신규상장 중 경쟁률 1000:1 이상 비중(막대)과 공모가 대비 시초가 평균(선).</span></figcaption><div class="chart" id="ch-ipo"></div></figure>
    <figure class="chart-block">
      <figcaption><b>최근 신규상장</b><span>공모가 대비 첫날 수익률(%).</span></figcaption>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>종목</th><th>상장일</th><th class="n">경쟁률</th><th class="n">시초가</th><th class="n">종가</th></tr></thead>
        <tbody id="ipo-rows"></tbody>
      </table></div>
    </figure>
  </section>

  <details class="about">
    <summary>지표와 판정 기준</summary>
    <div id="rules"></div>
    <p>출처: 한국거래소(지수·PER·PBR·시가총액·거래대금·투자자별 거래), 금융투자협회 FreeSIS(예탁금·신용잔고), 38커뮤니케이션(공모주). PER·PBR은 한국거래소의 실적 기준 값이라 증권사가 발표하는 12개월 선행 값과 다릅니다. 매매 판단을 대신하지 않습니다.</p>
  </details>
</main>

<nav class="tabbar" aria-label="화면">
  <button data-t="sum" aria-current="page">신호등</button>
  <button data-t="val">밸류에이션</button>
  <button data-t="flow">수급</button>
  <button data-t="mood">심리·공모주</button>
</nav>

<div class="tip" id="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
